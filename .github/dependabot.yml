# Dependency update automation (production-check.md 0.10).
#
# Security advisories are opened immediately by GitHub's security-updates
# feature; the weekly schedule below covers routine version drift.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Keep routine bumps to a handful of reviewable PRs.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-patches:
        dependency-type: production
        update-types: [patch]
    ignore:
      # Majors for the build toolchain and the router are upgraded deliberately
      # on a branch, not by an automated PR — they have broken things before.
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: react-router-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@vercel/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
